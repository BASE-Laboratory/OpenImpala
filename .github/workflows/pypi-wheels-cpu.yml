name: "Build and Publish OpenImpala CPU Wheels"

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  DEPS_CACHE_KEY: cibw-deps-manylinux_2_28-x86_64-hdf5_1.14.6-tiff_4.6.0-hypre_2.31.0-amrex_25.03-tinyprof-noeb-nofort-nompicxx-v9

jobs:
  build_core_and_cp39:
    name: Build C++ core, cp39 & pure-Python wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import pathlib, re; t = pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^fallback_version\s*=\s*\"([^\"]+)\"", t).group(1))')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel and build
        run: python -m pip install cibuildwheel==2.22.0 build

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/cibw-deps-cache
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Cache ccache objects (core + cp39)
        uses: actions/cache@v4
        with:
          path: /tmp/cibw-ccache
          key: ccache-cpu-manylinux_2_28-cp39-${{ github.sha }}
          restore-keys: |
            ccache-cpu-manylinux_2_28-cp39-

      - name: Build cp39 wheel and populate core ccache
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "*musllinux* *i686*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          CIBW_BEFORE_ALL_LINUX: >
            set -e &&
            export CCACHE_DISABLE=1 &&
            dnf install -y epel-release &&
            dnf --enablerepo=powertools install -y
            openmpi-devel gcc-c++ wget git xz
            zlib-devel libjpeg-turbo-devel python3-pip &&
            wget -q https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz -O /tmp/ccache.tar.xz &&
            tar xf /tmp/ccache.tar.xz -C /usr/bin --strip-components=1 &&
            rm -f /tmp/ccache.tar.xz &&
            mkdir -p /host/tmp/cibw-ccache &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            pip3 install "cmake>=3.28,<4" &&
            export PATH=/usr/local/bin:/usr/lib64/openmpi/bin:$PATH &&
            if [ -f /host/tmp/cibw-deps-cache/deps.tar.gz ]; then
            echo "=== Restoring cached dependencies ===" &&
            tar xzf /host/tmp/cibw-deps-cache/deps.tar.gz -C / ;
            else
            echo "=== Building dependencies from source ===" &&
            wget -q https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz &&
            tar xzf hdf5-1.14.6.tar.gz &&
            cd hdf5-1.14.6 &&
            CC=mpicc CXX=mpicxx CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC -DOMPI_SKIP_MPICXX=1" ./configure
            --prefix=/usr/local
            --enable-parallel
            --enable-cxx
            --enable-unsupported
            --disable-shared
            --with-pic &&
            make -j$(nproc) &&
            make install &&
            cd .. &&
            wget -q https://download.osgeo.org/libtiff/tiff-4.6.0.tar.gz &&
            tar xzf tiff-4.6.0.tar.gz &&
            cd tiff-4.6.0 &&
            cmake -S . -B build
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON &&
            cmake --build build -j$(nproc) &&
            cmake --install build &&
            cd .. &&
            wget -q https://github.com/hypre-space/hypre/archive/v2.31.0.tar.gz &&
            tar xzf v2.31.0.tar.gz &&
            cd hypre-2.31.0/src &&
            ./configure --prefix=/usr/local --with-MPI --disable-fortran --enable-shared=no
            CC=mpicc CXX=mpicxx
            CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC -DOMPI_SKIP_MPICXX=1" &&
            make -j$(nproc) &&
            make install &&
            cd ../.. &&
            git clone --depth 1 --branch 25.03 https://github.com/AMReX-Codes/amrex.git /tmp/amrex &&
            cmake -S /tmp/amrex -B /tmp/amrex/build
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DAMReX_MPI=ON
            -DAMReX_OMP=ON
            -DAMReX_EB=OFF
            -DAMReX_SPACEDIM=3
            -DAMReX_FORTRAN=OFF
            -DAMReX_PARTICLES=OFF
            -DAMReX_TINY_PROFILE=ON
            -DMPI_CXX_SKIP_MPICXX=ON
            '-DCMAKE_CXX_FLAGS=-DOMPI_SKIP_MPICXX=1'
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON &&
            cmake --build /tmp/amrex/build -j$(nproc) &&
            cmake --install /tmp/amrex/build &&
            (strip --strip-debug /usr/local/lib/libamrex_3d.a /usr/local/lib/libHYPRE.a /usr/local/lib/libhdf5*.a /usr/local/lib/libtiff.a 2>/dev/null || true) &&
            mkdir -p /host/tmp/cibw-deps-cache &&
            tar czf /host/tmp/cibw-deps-cache/deps.tar.gz /usr/local &&
            chmod -R a+rwX /host/tmp/cibw-deps-cache ;
            fi

          CIBW_BEFORE_BUILD: pip install "cmake>=3.28,<4" && rm -rf /tmp/oi-build

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/usr/local/bin:/usr/lib64/openmpi/bin:$PATH"
            CCACHE_DIR="/host/tmp/cibw-ccache"
            CCACHE_BASEDIR="/project"
            CCACHE_NOHASHDIR="true"
            SKBUILD_BUILD_DIR="/tmp/oi-build"
            CMAKE_C_COMPILER="mpicc"
            CMAKE_CXX_COMPILER="mpicxx"
            CMAKE_C_COMPILER_LAUNCHER="ccache"
            CMAKE_CXX_COMPILER_LAUNCHER="ccache"
            CMAKE_PREFIX_PATH="/usr/local"
            CMAKE_GENERATOR="Unix Makefiles"
            CMAKE_ARGS="-DFETCHCONTENT_BASE_DIR=/tmp/fc-deps"
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ steps.version.outputs.version }}"

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            ccache -s &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            auditwheel repair -w {dest_dir} {wheel}
            --exclude libmpi.so
            --exclude libmpi.so.12
            --exclude libmpi.so.40
            --exclude libmpi_cxx.so
            --exclude libmpi_cxx.so.1
            --exclude libmpi_cxx.so.40
            --exclude libopen-rte.so
            --exclude libopen-rte.so.40
            --exclude libopen-pal.so
            --exclude libopen-pal.so.40
            --exclude libmpi_mpifh.so
            --exclude libmpi_mpifh.so.40
            --exclude libgomp.so.1 &&
            /opt/python/cp39-cp39/bin/python /project/scripts/patch_wheel_rpath.py {dest_dir}

      - name: Verify host caches populated
        run: |
          ls -lh /tmp/cibw-deps-cache/deps.tar.gz
          du -sh /tmp/cibw-ccache

      - name: Build pure-Python fallback wheel (py3-none-any)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m build --wheel --outdir wheelhouse \
            -Cwheel.platlib=false \
            -Ccmake.define.OPENIMPALA_PURE_PYTHON=ON
          ls -lh wheelhouse/
          python -m zipfile -l wheelhouse/*-py3-none-any.whl
          if python -m zipfile -l wheelhouse/*-py3-none-any.whl | grep -q '_core'; then
            echo "::error::Pure-Python wheel unexpectedly contains compiled _core module"
            exit 1
          fi

      - name: Upload cp39 and pure-Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-part-cp39
          path: ./wheelhouse/*.whl
          retention-days: 1

  build_matrix_wheels:
    name: Build ${{ matrix.py }} manylinux wheel
    needs: build_core_and_cp39
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: [cp310, cp311, cp312, cp313]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import pathlib, re; t = pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^fallback_version\s*=\s*\"([^\"]+)\"", t).group(1))')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Restore native dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cibw-deps-cache
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Cache ccache objects (${{ matrix.py }})
        uses: actions/cache@v4
        with:
          path: /tmp/cibw-ccache
          key: ccache-cpu-manylinux_2_28-${{ matrix.py }}-${{ github.sha }}
          restore-keys: |
            ccache-cpu-manylinux_2_28-cp39-${{ github.sha }}
            ccache-cpu-manylinux_2_28-${{ matrix.py }}-
            ccache-cpu-manylinux_2_28-cp39-

      - name: Build ${{ matrix.py }} wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_SKIP: "*musllinux* *i686*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          CIBW_BEFORE_ALL_LINUX: >
            set -e &&
            dnf install -y epel-release &&
            dnf --enablerepo=powertools install -y
            openmpi-devel gcc-c++ wget git xz
            zlib-devel libjpeg-turbo-devel python3-pip &&
            tar xzf /host/tmp/cibw-deps-cache/deps.tar.gz -C / &&
            wget -q https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz -O /tmp/ccache.tar.xz &&
            tar xf /tmp/ccache.tar.xz -C /usr/bin --strip-components=1 &&
            rm -f /tmp/ccache.tar.xz &&
            mkdir -p /host/tmp/cibw-ccache &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            pip3 install "cmake>=3.28,<4"

          CIBW_BEFORE_BUILD: pip install "cmake>=3.28,<4" && rm -rf /tmp/oi-build

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/usr/local/bin:/usr/lib64/openmpi/bin:$PATH"
            CCACHE_DIR="/host/tmp/cibw-ccache"
            CCACHE_BASEDIR="/project"
            CCACHE_NOHASHDIR="true"
            SKBUILD_BUILD_DIR="/tmp/oi-build"
            CMAKE_C_COMPILER="mpicc"
            CMAKE_CXX_COMPILER="mpicxx"
            CMAKE_C_COMPILER_LAUNCHER="ccache"
            CMAKE_CXX_COMPILER_LAUNCHER="ccache"
            CMAKE_PREFIX_PATH="/usr/local"
            CMAKE_GENERATOR="Unix Makefiles"
            CMAKE_ARGS="-DFETCHCONTENT_BASE_DIR=/tmp/fc-deps"
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ steps.version.outputs.version }}"

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            ccache -s &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            auditwheel repair -w {dest_dir} {wheel}
            --exclude libmpi.so
            --exclude libmpi.so.12
            --exclude libmpi.so.40
            --exclude libmpi_cxx.so
            --exclude libmpi_cxx.so.1
            --exclude libmpi_cxx.so.40
            --exclude libopen-rte.so
            --exclude libopen-rte.so.40
            --exclude libopen-pal.so
            --exclude libopen-pal.so.40
            --exclude libmpi_mpifh.so
            --exclude libmpi_mpifh.so.40
            --exclude libgomp.so.1 &&
            /opt/python/${{ matrix.py }}-${{ matrix.py }}/bin/python /project/scripts/patch_wheel_rpath.py {dest_dir}

      - name: Upload ${{ matrix.py }} wheel
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-part-${{ matrix.py }}
          path: ./wheelhouse/*.whl
          retention-days: 1

  bundle_wheels:
    name: Bundle CPU & pure-Python wheels
    needs: [build_core_and_cp39, build_matrix_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all wheel parts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-part-*
          merge-multiple: true
          path: wheelhouse/

      - name: Verify complete wheelhouse (5 manylinux + 1 pure-Python)
        run: |
          ls -lh wheelhouse/
          COUNT=$(ls -1 wheelhouse/*.whl | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::Expected 6 wheels (cp39..cp313 + py3-none-any), found $COUNT"
            exit 1
          fi

      - name: Set up Python 3.12 for wheel smoke & analytical V&V tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke & analytical V&V on installed wheels (pure-Python, loud no-MPI warning, pip-openmpi auto-RPATH & 2-rank MPI)
        run: |
          set -euo pipefail
          PURE_WHL="$(ls "$PWD"/wheelhouse/openimpala-*-py3-none-any.whl)"
          CPU_WHL="$(ls "$PWD"/wheelhouse/openimpala-*-cp312-cp312-manylinux_2_28_x86_64.whl)"
          EXPECTED_VER="$(basename "$PURE_WHL" | sed -E 's/^openimpala-([^-]+)-.*/\1/')"
          VV_SCRIPT="$PWD/tests/validation/wheel_analytical_vv.py"
          echo "Verifying wheels for expected version: ${EXPECTED_VER}"

          cat > /tmp/wheel_smoke.py << 'PYEOF'
          import pathlib
          import subprocess
          import sys
          import warnings
          import numpy as np

          exp_ver, exp_backend = sys.argv[1], sys.argv[2]
          exp_ranks = int(sys.argv[3]) if len(sys.argv) > 3 and sys.argv[3].isdigit() else 1
          expect_err = "--expect-load-error" in sys.argv

          with warnings.catch_warnings(record=True) as import_warnings:
              warnings.simplefilter("always")
              import openimpala as oi

          if expect_err:
              assert any("pip install openmpi" in str(w.message) for w in import_warnings), (
                  f"Expected loud import warning mentioning OpenMPI remedy, got {import_warnings}"
              )
          else:
              assert not any("_core" in str(w.message) for w in import_warnings), (
                  f"Unexpected _core fallback warning: {import_warnings}"
              )

          assert oi.__version__ == exp_ver, f"version mismatch: {oi.__version__} != {exp_ver}"
          pkg_dir = pathlib.Path(oi.__file__).resolve().parent
          assert (pkg_dir / "py.typed").is_file(), f"missing py.typed in {pkg_dir}"

          if exp_ranks == 1:
              out = subprocess.check_output([sys.executable, "-m", "openimpala.cli", "--version"], text=True)
              assert exp_ver in out, f"CLI --version mismatch: {out!r}"

          with oi.Session():
              info = oi.build_info()
              assert info["backend"] == exp_backend, f"backend mismatch: {info}"
              assert info["mpi_ranks"] == exp_ranks, f"mpi_ranks mismatch: {info}"
              if expect_err:
                  assert info["core_load_error"], f"expected core_load_error: {info}"

              vol = oi.synthetic.gaussian_blobs((16, 16, 16), porosity=0.65, blobiness=1.5, seed=7)
              ds, vz = oi.downsample_volume(vol, factor=2, mode="majority", voxel_size=1.0)
              assert ds.shape == (8, 8, 8) and vz == (2.0, 2.0, 2.0)

              gray = np.where(vol == 1, 40, 210).astype(np.uint8)
              th = oi.otsu_threshold(gray)
              assert 40.0 <= th < 210.0

              slab = np.ones((16, 16, 16), dtype=np.int32)
              pf_root = pathlib.Path(f"/tmp/oi_smoke_pf_{exp_backend}_{exp_ranks}")
              res = oi.tortuosity(slab, phase=1, direction="z", write_plotfile=True, results_path=str(pf_root))
              assert abs(res.tortuosity - 1.0) < 1e-4, f"unexpected slab tau: {res.tortuosity}"
              assert res.plotfile_path and (pathlib.Path(res.plotfile_path) / "Header").is_file()

              deff = oi.effective_diffusivity(slab, phase=1)
              assert np.allclose(deff.tensor, np.eye(3), atol=1e-4)
              assert np.allclose(deff.D_eff, np.eye(3), atol=1e-4)

          if info["mpi_rank"] == 0:
              print(f"[OK] {exp_backend} (ranks={exp_ranks}, ver={oi.__version__}) passed all smoke checks")
          PYEOF

          # 1. Universal pure-Python wheel in clean host venv + full analytical V&V
          python -m venv /tmp/venv-pure
          /tmp/venv-pure/bin/pip install --quiet "$PURE_WHL"
          (cd /tmp && /tmp/venv-pure/bin/python /tmp/wheel_smoke.py "$EXPECTED_VER" pure-python)
          (cd /tmp && /tmp/venv-pure/bin/python "$VV_SCRIPT" --expected-backend pure-python --expected-version "$EXPECTED_VER" --check-silent-exit)

          # 2. Compiled manylinux wheel on bare Linux:
          #    (a) WITHOUT OpenMPI -> loud import warning + safe pure-Python fallback
          #    (b) WITH `pip install openmpi` & ZERO LD_LIBRARY_PATH -> automatic C++ loading + cross-backend V&V!
          docker run --rm \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -v /tmp/wheel_smoke.py:/tmp/wheel_smoke.py:ro \
            -v "$VV_SCRIPT:/tmp/wheel_analytical_vv.py:ro" \
            python:3.12-slim \
            bash -c "
              set -euo pipefail
              pip install --quiet /wheels/$(basename "$CPU_WHL")
              cd /tmp
              python /tmp/wheel_smoke.py '$EXPECTED_VER' pure-python --expect-load-error
              pip install --quiet openmpi
              unset LD_LIBRARY_PATH
              python /tmp/wheel_smoke.py '$EXPECTED_VER' cpp-cpu 1
              python /tmp/wheel_analytical_vv.py --expected-backend cpp-cpu --expected-version '$EXPECTED_VER' --compare-pure --check-silent-exit
            "

          # 3. Compiled manylinux wheel WITH system OpenMPI (1-rank & 2-rank MPI C++ AMReX/HYPRE V&V)
          docker run --rm \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -v /tmp/wheel_smoke.py:/tmp/wheel_smoke.py:ro \
            -v "$VV_SCRIPT:/tmp/wheel_analytical_vv.py:ro" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c "
              set -euo pipefail
              dnf install -y -q epel-release
              dnf --enablerepo=powertools install -y -q openmpi-devel
              export PATH=/usr/lib64/openmpi/bin:\$PATH
              export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:\${LD_LIBRARY_PATH:-}
              /opt/python/cp312-cp312/bin/pip install --quiet /wheels/$(basename "$CPU_WHL")
              cd /tmp
              /opt/python/cp312-cp312/bin/python /tmp/wheel_smoke.py '$EXPECTED_VER' cpp-cpu 1
              OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 OMP_NUM_THREADS=1 \
                mpirun -np 2 --oversubscribe /opt/python/cp312-cp312/bin/python /tmp/wheel_smoke.py '$EXPECTED_VER' cpp-cpu 2
              OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 OMP_NUM_THREADS=1 \
                mpirun -np 2 --oversubscribe /opt/python/cp312-cp312/bin/python /tmp/wheel_analytical_vv.py --expected-backend cpp-cpu --expected-version '$EXPECTED_VER' --expected-ranks 2
            "

      - name: Upload unified wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish wheels to PyPI
    needs: bundle_wheels
    runs-on: ubuntu-latest
    # Only publish on release; workflow_dispatch leaves the artifact for manual
    # inspection without touching PyPI.
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
