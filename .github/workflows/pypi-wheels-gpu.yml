name: "Build and Publish OpenImpala GPU Wheels (CUDA)"

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  GPU_DEPS_CACHE_KEY: cibw-deps-gpu-cuda12.6-manylinux_2_34-x86_64-hdf5_1.14.6-tiff_4.6.0-hypre_2.31.0-amrex_25.03-gcc13-nvtx3.1.1-arch75v-80r-89r-nordc-noeb-nofort-nompicxx-compressall-v17

jobs:
  build_core_and_cp39:
    name: Build CUDA C++ core & cp39 GPU wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import pathlib, re; t = pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^fallback_version\s*=\s*\"([^\"]+)\"", t).group(1))')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Restore native GPU dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cibw-deps-cache
          key: ${{ env.GPU_DEPS_CACHE_KEY }}

      - name: Cache CUDA ccache objects (core + cp39)
        uses: actions/cache@v4
        with:
          path: /tmp/cibw-ccache
          key: ccache-gpu-nordc-cuda12.6-cp39-${{ github.sha }}
          restore-keys: |
            ccache-gpu-nordc-cuda12.6-cp39-

      - name: Build cp39 GPU wheel and populate CUDA core ccache
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "*musllinux* *i686*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: sameli/manylinux_2_34_x86_64_cuda_12.6

          CIBW_BEFORE_ALL_LINUX: >
            set -e &&
            export CCACHE_DISABLE=1 &&
            dnf install -y epel-release &&
            dnf --enablerepo=crb install -y
            openmpi-devel gcc-c++ wget git xz
            zlib-devel libjpeg-turbo-devel python3-pip
            gcc-toolset-13 gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ &&
            wget -q https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz -O /tmp/ccache.tar.xz &&
            tar xf /tmp/ccache.tar.xz -C /usr/bin --strip-components=1 &&
            rm -f /tmp/ccache.tar.xz &&
            mkdir -p /host/tmp/cibw-ccache &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            pip3 install "cmake>=3.28,<4" &&
            export PATH=/usr/local/bin:/opt/rh/gcc-toolset-13/root/usr/bin:/usr/lib64/openmpi/bin:/usr/local/cuda/bin:$PATH &&
            export CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc &&
            export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++ &&
            export CUDA_HOME=/usr/local/cuda &&
            if [ -f /host/tmp/cibw-deps-cache/deps.tar.gz ]; then
            echo "=== Restoring cached GPU dependencies ===" &&
            tar xzf /host/tmp/cibw-deps-cache/deps.tar.gz -C / ;
            else
            echo "=== Building GPU dependencies from source ===" &&
            wget -q https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz &&
            tar xzf hdf5-1.14.6.tar.gz &&
            cd hdf5-1.14.6 &&
            CC=mpicc CXX=mpicxx CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC -DOMPI_SKIP_MPICXX=1" ./configure
            --prefix=/usr/local
            --enable-parallel
            --enable-cxx
            --enable-unsupported
            --disable-shared
            --with-pic &&
            make -j$(nproc) &&
            make install &&
            cd .. &&
            wget -q https://download.osgeo.org/libtiff/tiff-4.6.0.tar.gz &&
            tar xzf tiff-4.6.0.tar.gz &&
            cd tiff-4.6.0 &&
            cmake -S . -B build
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON &&
            cmake --build build -j$(nproc) &&
            cmake --install build &&
            cd .. &&
            wget -q https://github.com/hypre-space/hypre/archive/v2.31.0.tar.gz &&
            tar xzf v2.31.0.tar.gz &&
            cd hypre-2.31.0/src &&
            ./configure --prefix=/usr/local --with-MPI --with-cuda
            --with-cuda-home=/usr/local/cuda --with-gpu-arch="80 89"
            --disable-fortran --enable-shared=no
            CC=mpicc CXX=mpicxx
            CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC -DOMPI_SKIP_MPICXX=1"
            CUDA_HOME=/usr/local/cuda &&
            sed -i '/^CUDA_ARCH/s/$/ -gencode arch=compute_75,code=compute_75 -Xfatbin --compress-all/' config/Makefile.config &&
            grep '^CUDA_ARCH' config/Makefile.config &&
            make -j$(nproc) &&
            make install &&
            cd ../.. &&
            wget -q https://github.com/NVIDIA/NVTX/archive/refs/tags/v3.1.1.tar.gz -O nvtx.tar.gz &&
            tar xzf nvtx.tar.gz &&
            mkdir -p /usr/local/cuda/include/nvtx3 /usr/local/include/nvtx3 &&
            cp -rf NVTX-3.1.1/c/include/nvtx3/. /usr/local/cuda/include/nvtx3/ &&
            cp -rf NVTX-3.1.1/c/include/nvtx3/. /usr/local/include/nvtx3/ &&
            git clone --depth 1 --branch 25.03 https://github.com/AMReX-Codes/amrex.git /tmp/amrex &&
            sed -i 's|CUDA::nvToolsExt|CUDA::nvtx3|g' /tmp/amrex/Tools/CMake/AMReXParallelBackends.cmake &&
            sed -i 's|set(AMREX_CUDA_ARCHS ${_tmp} CACHE INTERNAL|set(AMREX_CUDA_ARCHS "80-real;89-real;75-virtual" CACHE INTERNAL|' /tmp/amrex/Tools/CMake/AMReXUtils.cmake &&
            sed -i 's|@AMREX_CUDA_ARCHS@|"80-real;89-real;75-virtual"|g' /tmp/amrex/Tools/CMake/AMReXConfig.cmake.in &&
            sed -i 's|CUDA_ARCHITECTURES ${AMREX_CUDA_ARCHS})|CUDA_ARCHITECTURES "${AMREX_CUDA_ARCHS}")|' /tmp/amrex/Tools/CMake/AMReXConfig.cmake.in &&
            cmake -S /tmp/amrex -B /tmp/amrex/build
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DAMReX_MPI=ON
            -DAMReX_OMP=ON
            -DAMReX_EB=OFF
            -DAMReX_SPACEDIM=3
            -DAMReX_FORTRAN=OFF
            -DAMReX_PARTICLES=OFF
            -DAMReX_TINY_PROFILE=ON
            -DAMReX_GPU_BACKEND=CUDA
            -DAMReX_GPU_RDC=OFF
            '-DAMReX_CUDA_ARCH=75;80;89'
            -DMPI_CXX_SKIP_MPICXX=ON
            '-DCMAKE_CXX_FLAGS=-DOMPI_SKIP_MPICXX=1'
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            '-DCMAKE_CUDA_ARCHITECTURES=80-real;89-real;75-virtual'
            -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-13/root/usr/bin/g++
            '-DCMAKE_CUDA_FLAGS=-Xfatbin --compress-all' &&
            cmake --build /tmp/amrex/build -j$(nproc) &&
            cmake --install /tmp/amrex/build &&
            mkdir -p /host/tmp/cibw-deps-cache &&
            tar czf /host/tmp/cibw-deps-cache/deps.tar.gz /usr/local &&
            chmod -R a+rwX /host/tmp/cibw-deps-cache ;
            fi &&
            echo "=== Verified installed AMReXConfig.cmake ===" &&
            grep -n 'AMREX_CUDA_ARCHS\|AMReX_GPU_RDC' /usr/local/lib/cmake/AMReX/AMReXConfig.cmake

          CIBW_BEFORE_BUILD: >
            pip install "cmake>=3.28,<4" &&
            rm -rf /tmp/oi-build &&
            sed -i 's/^name = "openimpala"/name = "openimpala-cuda"/' /project/pyproject.toml &&
            sed -i 's/^    #"nvidia-/    "nvidia-/' /project/pyproject.toml

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/usr/local/bin:/opt/rh/gcc-toolset-13/root/usr/bin:/usr/lib64/openmpi/bin:/usr/local/cuda/bin:$PATH"
            CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
            CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            CUDA_HOME="/usr/local/cuda"
            CUDAHOSTCXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            CCACHE_DIR="/host/tmp/cibw-ccache"
            CCACHE_BASEDIR="/project"
            CCACHE_NOHASHDIR="true"
            CCACHE_MAXSIZE="4G"
            SKBUILD_BUILD_DIR="/tmp/oi-build"
            CMAKE_C_COMPILER="mpicc"
            CMAKE_CXX_COMPILER="mpicxx"
            CMAKE_C_COMPILER_LAUNCHER="ccache"
            CMAKE_CXX_COMPILER_LAUNCHER="ccache"
            CMAKE_CUDA_COMPILER_LAUNCHER="ccache"
            CMAKE_PREFIX_PATH="/usr/local"
            CMAKE_GENERATOR="Unix Makefiles"
            CMAKE_ARGS="-DGPU_BACKEND=CUDA '-DCMAKE_CUDA_ARCHITECTURES=80-real;89-real;75-virtual' -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-13/root/usr/bin/g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_BASE_DIR=/tmp/fc-deps"
            CUDAFLAGS="-Xfatbin --compress-all"
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ steps.version.outputs.version }}"

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            ccache -s &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            auditwheel repair --strip -w {dest_dir} {wheel}
            --exclude libmpi.so
            --exclude libmpi.so.12
            --exclude libmpi.so.40
            --exclude libmpi_cxx.so
            --exclude libmpi_cxx.so.1
            --exclude libmpi_cxx.so.40
            --exclude libopen-rte.so
            --exclude libopen-rte.so.40
            --exclude libopen-pal.so
            --exclude libopen-pal.so.40
            --exclude libmpi_mpifh.so
            --exclude libmpi_mpifh.so.40
            --exclude libgomp.so.1
            --exclude libcuda.so
            --exclude libcuda.so.1
            --exclude libcudart.so
            --exclude libcudart.so.12
            --exclude libcublas.so
            --exclude libcublas.so.12
            --exclude libcublasLt.so
            --exclude libcublasLt.so.12
            --exclude libcusparse.so
            --exclude libcusparse.so.12
            --exclude libcurand.so
            --exclude libcurand.so.10
            --exclude libnvJitLink.so
            --exclude libnvJitLink.so.12 &&
            /opt/python/cp39-cp39/bin/python /project/scripts/patch_wheel_rpath.py {dest_dir}

      - name: Check GPU dependencies tarball
        id: check-deps
        if: always()
        run: |
          if [ -f /tmp/cibw-deps-cache/deps.tar.gz ]; then
            ls -lh /tmp/cibw-deps-cache/deps.tar.gz
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save native GPU dependencies cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true' && steps.check-deps.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/cibw-deps-cache
          key: ${{ env.GPU_DEPS_CACHE_KEY }}

      - name: Verify host GPU caches populated
        run: |
          ls -lh /tmp/cibw-deps-cache/deps.tar.gz
          du -sh /tmp/cibw-ccache

      - name: Upload cp39 GPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-gpu-part-cp39
          path: ./wheelhouse/*.whl
          retention-days: 1

  build_matrix_wheels:
    name: Build ${{ matrix.py }} CUDA GPU wheel
    needs: build_core_and_cp39
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: [cp310, cp311, cp312, cp313]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import pathlib, re; t = pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^fallback_version\s*=\s*\"([^\"]+)\"", t).group(1))')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Restore native GPU dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cibw-deps-cache
          key: ${{ env.GPU_DEPS_CACHE_KEY }}

      - name: Cache CUDA ccache objects (${{ matrix.py }})
        uses: actions/cache@v4
        with:
          path: /tmp/cibw-ccache
          key: ccache-gpu-nordc-cuda12.6-${{ matrix.py }}-${{ github.sha }}
          restore-keys: |
            ccache-gpu-nordc-cuda12.6-cp39-${{ github.sha }}
            ccache-gpu-nordc-cuda12.6-${{ matrix.py }}-
            ccache-gpu-nordc-cuda12.6-cp39-

      - name: Build ${{ matrix.py }} GPU wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_SKIP: "*musllinux* *i686*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: sameli/manylinux_2_34_x86_64_cuda_12.6

          CIBW_BEFORE_ALL_LINUX: >
            set -e &&
            dnf install -y epel-release &&
            dnf --enablerepo=crb install -y
            openmpi-devel gcc-c++ wget git xz
            zlib-devel libjpeg-turbo-devel python3-pip
            gcc-toolset-13 gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ &&
            tar xzf /host/tmp/cibw-deps-cache/deps.tar.gz -C / &&
            wget -q https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz -O /tmp/ccache.tar.xz &&
            tar xf /tmp/ccache.tar.xz -C /usr/bin --strip-components=1 &&
            rm -f /tmp/ccache.tar.xz &&
            mkdir -p /host/tmp/cibw-ccache &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            pip3 install "cmake>=3.28,<4" &&
            grep -n 'AMREX_CUDA_ARCHS' /usr/local/lib/cmake/AMReX/AMReXConfig.cmake

          CIBW_BEFORE_BUILD: >
            pip install "cmake>=3.28,<4" &&
            rm -rf /tmp/oi-build &&
            sed -i 's/^name = "openimpala"/name = "openimpala-cuda"/' /project/pyproject.toml &&
            sed -i 's/^    #"nvidia-/    "nvidia-/' /project/pyproject.toml

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/usr/local/bin:/opt/rh/gcc-toolset-13/root/usr/bin:/usr/lib64/openmpi/bin:/usr/local/cuda/bin:$PATH"
            CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
            CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            CUDA_HOME="/usr/local/cuda"
            CUDAHOSTCXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            CCACHE_DIR="/host/tmp/cibw-ccache"
            CCACHE_BASEDIR="/project"
            CCACHE_NOHASHDIR="true"
            CCACHE_MAXSIZE="4G"
            SKBUILD_BUILD_DIR="/tmp/oi-build"
            CMAKE_C_COMPILER="mpicc"
            CMAKE_CXX_COMPILER="mpicxx"
            CMAKE_C_COMPILER_LAUNCHER="ccache"
            CMAKE_CXX_COMPILER_LAUNCHER="ccache"
            CMAKE_CUDA_COMPILER_LAUNCHER="ccache"
            CMAKE_PREFIX_PATH="/usr/local"
            CMAKE_GENERATOR="Unix Makefiles"
            CMAKE_ARGS="-DGPU_BACKEND=CUDA '-DCMAKE_CUDA_ARCHITECTURES=80-real;89-real;75-virtual' -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-13/root/usr/bin/g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_BASE_DIR=/tmp/fc-deps"
            CUDAFLAGS="-Xfatbin --compress-all"
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ steps.version.outputs.version }}"

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            ccache -s &&
            chmod -R a+rwX /host/tmp/cibw-ccache &&
            auditwheel repair --strip -w {dest_dir} {wheel}
            --exclude libmpi.so
            --exclude libmpi.so.12
            --exclude libmpi.so.40
            --exclude libmpi_cxx.so
            --exclude libmpi_cxx.so.1
            --exclude libmpi_cxx.so.40
            --exclude libopen-rte.so
            --exclude libopen-rte.so.40
            --exclude libopen-pal.so
            --exclude libopen-pal.so.40
            --exclude libmpi_mpifh.so
            --exclude libmpi_mpifh.so.40
            --exclude libgomp.so.1
            --exclude libcuda.so
            --exclude libcuda.so.1
            --exclude libcudart.so
            --exclude libcudart.so.12
            --exclude libcublas.so
            --exclude libcublas.so.12
            --exclude libcublasLt.so
            --exclude libcublasLt.so.12
            --exclude libcusparse.so
            --exclude libcusparse.so.12
            --exclude libcurand.so
            --exclude libcurand.so.10
            --exclude libnvJitLink.so
            --exclude libnvJitLink.so.12 &&
            /opt/python/${{ matrix.py }}-${{ matrix.py }}/bin/python /project/scripts/patch_wheel_rpath.py {dest_dir}

      - name: Upload ${{ matrix.py }} GPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-gpu-part-${{ matrix.py }}
          path: ./wheelhouse/*.whl
          retention-days: 1

  bundle_gpu_wheels:
    name: Bundle & verify CUDA GPU wheels
    needs: [build_core_and_cp39, build_matrix_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all GPU wheel parts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-gpu-part-*
          merge-multiple: true
          path: wheelhouse/

      - name: Verify complete GPU wheelhouse and PyPI 320 MB limit
        run: |
          ls -lh wheelhouse/
          COUNT=$(ls -1 wheelhouse/*.whl | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "::error::Expected 5 GPU wheels (cp39..cp313), found $COUNT"
            exit 1
          fi
          MAX_BYTES=315000000
          for whl in wheelhouse/*.whl; do
            SZ=$(stat -c%s "$whl")
            echo "$whl: $SZ bytes ($((SZ / 1000000)) MB)"
            if [ "$SZ" -gt "$MAX_BYTES" ]; then
              echo "::error::Wheel $whl ($SZ bytes) exceeds PyPI 320 MB limit"
              exit 1
            fi
          done

      - name: Smoke-test & analytical V&V on CUDA wheel (pip-openmpi auto-RPATH + GPU-less login-node safety)
        run: |
          set -euo pipefail
          GPU_WHL="$(ls "$PWD"/wheelhouse/openimpala_cuda-*-cp312-cp312-*.whl)"
          EXPECTED_VER="$(basename "$GPU_WHL" | sed -E 's/^openimpala_cuda-([^-]+)-.*/\1/')"
          VV_SCRIPT="$PWD/tests/validation/wheel_analytical_vv.py"
          cat > /tmp/gpu_wheel_smoke.py << 'PYEOF'
          import pathlib
          import sys
          import warnings
          import numpy as np
          import openimpala as oi

          exp_ver = sys.argv[1]
          assert oi.__version__ == exp_ver, f"version mismatch: {oi.__version__} != {exp_ver}"
          assert (pathlib.Path(oi.__file__).resolve().parent / "py.typed").is_file()

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              with oi.Session():
                  info = oi.build_info()
                  assert info["backend"] == "pure-python", info
                  assert info["core_load_error"] and "NVIDIA GPU" in info["core_load_error"], info
                  res = oi.tortuosity(np.ones((12, 12, 12), dtype=np.int32), phase=1, direction="z")
                  assert abs(res.tortuosity - 1.0) < 1e-4
          assert any("NVIDIA GPU" in str(w.message) for w in caught), caught
          print(f"[OK] openimpala-cuda {oi.__version__} safely caught missing GPU and fell back without SIGABRT")
          PYEOF

          docker run --rm \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -v /tmp/gpu_wheel_smoke.py:/tmp/gpu_wheel_smoke.py:ro \
            -v "$VV_SCRIPT:/tmp/wheel_analytical_vv.py:ro" \
            sameli/manylinux_2_34_x86_64_cuda_12.6 \
            bash -c "
              set -euo pipefail
              /opt/python/cp312-cp312/bin/pip install --quiet openmpi /wheels/$(basename "$GPU_WHL")
              unset LD_LIBRARY_PATH
              cd /tmp
              /opt/python/cp312-cp312/bin/python /tmp/gpu_wheel_smoke.py '$EXPECTED_VER'
              /opt/python/cp312-cp312/bin/python /tmp/wheel_analytical_vv.py --expected-backend pure-python --expected-version '$EXPECTED_VER'
            "

      - name: Upload unified GPU wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-gpu
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish GPU wheels to PyPI (openimpala-cuda)
    needs: bundle_gpu_wheels
    runs-on: ubuntu-latest
    # Only publish on release; workflow_dispatch leaves the artifact for manual
    # inspection without touching PyPI.
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-gpu
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
