# .github/workflows/docs.yml
name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'python/**'
      - 'tutorials/**'
      - 'Doxyfile'
      - 'docs/**'
      - 'paper.md'
      - 'paper.bib'
      - 'Overview.png'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'python/**'
      - 'tutorials/**'
      - 'Doxyfile'
      - 'docs/**'
      - 'paper.md'
      - 'paper.bib'
      - 'Overview.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          echo "Doxygen version: $(doxygen --version)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sphinx and dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate Doxygen XML and HTML
        run: doxygen Doxyfile

      - name: Build Sphinx documentation
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          OPENIMPALA_REQUIRE_DOXYGEN: "1"
        run: sphinx-build -W --keep-going -b html docs/ docs/_build/html

      - name: Copy Doxygen HTML into Sphinx output
        run: cp -r docs/doxygen/html docs/_build/html/doxygen

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  joss-paper:
    name: Build JOSS Paper PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile paper.md via openjournals/inara
        run: |
          docker run --rm \
            --volume "$PWD:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara:latest \
            -o pdf paper.md
          test -s paper.pdf
          ls -lh paper.pdf

      - name: Upload JOSS paper.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: paper.pdf

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
