# Pure-Python build configuration for the openimpala package.
#
# This builds a wheel containing only the Python files (no compiled _core.so).
# The pure-Python solver backend (SciPy/CuPy) provides full functionality
# without any C++ dependencies.
#
# The root pyproject.toml (scikit-build-core) is used for compiled wheels
# (openimpala-cuda) that include the C++ HYPRE/AMReX backend.

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openimpala"
dynamic = ["version"]
description = "Transport-property computation on 3-D voxel images — tortuosity, diffusivity, and more"
readme = {text = "Transport-property computation on 3-D voxel images — tortuosity, diffusivity, and more.", content-type = "text/plain"}
license = "BSD-3-Clause"
authors = [{name = "James Le Houx", email = "j.lehoux@greenwich.ac.uk"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/BASE-Laboratory/OpenImpala"
Documentation = "https://base-laboratory.github.io/OpenImpala/"
Repository = "https://github.com/BASE-Laboratory/OpenImpala"
Issues = "https://github.com/BASE-Laboratory/OpenImpala/issues"
Changelog = "https://base-laboratory.github.io/OpenImpala/changelog.html"

[project.optional-dependencies]
mpi = ["mpi4py"]
openmpi = ["openmpi; platform_system == 'Linux'"]
progress = ["tqdm"]
jupyter = ["matplotlib", "ipywidgets"]
viz = ["yt", "matplotlib"]
zarr = ["zarr>=2.16"]
test = [
    "pytest>=7",
    "numpy",
    "scipy>=1.7",
    "zarr>=2.16",
]

[project.scripts]
openimpala = "openimpala.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openimpala*"]

[tool.setuptools.package-data]
openimpala = ["py.typed"]

[tool.setuptools_scm]
root = ".."
local_scheme = "no-local-version"
fallback_version = "5.0.0"
